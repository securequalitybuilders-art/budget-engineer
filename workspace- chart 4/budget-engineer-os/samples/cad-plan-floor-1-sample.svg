<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 16 12" width="800" height="600" style="background:#0b1220;font-family:JetBrains Mono,monospace;">
  <defs>
    <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
      <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#24324b" stroke-width="0.05"/>
    </pattern>
  </defs>
  <rect x="-2" y="-2" width="16" height="12" fill="url(#grid)"/>
  <!-- Exterior Envelope -->
  <path d="M 0 0 L 12 0 L 12 8 L 0 8 Z" fill="none" stroke="#1a365d" stroke-width="0.2"/>
  <!-- Partition Wall -->
  <line x1="6" y1="0" x2="6" y2="8" stroke="#d4a574" stroke-width="0.15"/>
  <!-- Furniture Block -->
  <rect x="2" y="2" width="2" height="1" rx="0.1" fill="#8B5CF6" opacity="0.8"/>
  <text x="3" y="2.6" fill="#f8fafc" font-size="0.4" text-anchor="middle">Sofa</text>
  <!-- Title -->
  <text x="6" y="-1" fill="#06B6D4" font-size="0.6" text-anchor="middle" font-weight="bold">Stage 26 CAD Floor Plan</text>
</svg>
